schema_version: 1
default:
  skill: medlearn-agent-coding
  read:
    - AGENTS.md
    - docs/PROJECT_CONSTITUTION.md
    - docs/MVP_PRD_V2.md
    - docs/CURRENT_STATE.md
    - docs/ADR_INDEX.yaml
    - CONTEXT.md
  checks:
    - checklists/no-regression-rules.md

routes:
  ui:
    triggers: [screen, component, navigation, layout, styling, accessibility]
    skill: medlearn-review-ui
    read:
      - docs/DESIGN_CONTEXT.md
      - docs/LEARNING_DESIGN_PRINCIPLES.md
      - constants/theme.ts
    checks:
      - checklists/app-integration-gate.md

  ingestion:
    triggers: [textbook, extraction, ingestion, catalog, knowledge_nodes, document_chunks, causal_chains]
    skill: medlearn-review-ingestion
    read:
      - docs/PIPELINE_INDEX.md
      - manifests/internal_medicine_ingestion.yaml
      - state/knowledge_ingestion.yaml
    adr_tags: [textbook_version, textbook_pipeline, evidence_artifact, knowledge_detail]
    checks:
      - checklists/evidence-copy-eval.md
      - checklists/app-integration-gate.md

  medical_content:
    triggers: [medical_claim, evidence, page_reference, treatment, dosage, contraindication, case_content]
    skill: medlearn-validate-medical-content
    read:
      - docs/adr/ADR-006-textbook-owned-knowledge-aspects.md
      - docs/adr/ADR-009-multimodal-evidence-artifacts.md
      - docs/adr/ADR-010-transactional-review-consistency.md
    checks:
      - checklists/evidence-copy-eval.md
      - checklists/production-acceptance.md

  training:
    triggers: [sft, lora, dataset, checkpoint, adapter, stage_evaluation]
    skill: medlearn-evaluate-training-stage
    read:
      - training/README.md
      - training/data_cleaning_rules.yaml
      - training/curriculum/README.md
    checks:
      - checklists/evidence-copy-eval.md

  release:
    triggers: [production, deploy, release, acceptance]
    skill: medlearn-agent-coding
    read:
      - docs/E2E_ACCEPTANCE_CHECKLIST.md
      - docs/REMOTE_DEPLOYMENT_GUIDE.md
    checks:
      - checklists/production-acceptance.md
      - checklists/no-regression-rules.md

