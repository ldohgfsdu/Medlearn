name: Repository quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client-and-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install CI Python baseline
        run: python -m pip install -r scripts/requirements-ci.txt

      - name: Validate project state
        run: |
          python scripts/validate_project_state.py
          python scripts/generate_current_state.py --check

      - name: Run client quality gate
        run: npm run check

      - name: Run Python regression suite
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Verify pipeline contracts
        run: |
          # Local-only by default. Remote checks require explicit --remote
          # authorization and are intentionally excluded from CI.
          python scripts/verify_p0_smoke.py
          python scripts/verify_pipeline_closure.py

      - name: Verify Phase 1 clean-checkout assets
        run: |
          git ls-files --error-unmatch \
            constants/ev1DisplayContracts.ts \
            constants/ev1DisplayContractsChunks/*.ts \
            constants/phase1PageImageAssets.ts \
            constants/phase1VisualEvidenceBundle.ts \
            assets/textbooks/internal-medicine-10/pages/*.webp
          python scripts/export_ev1_display_contracts_ts.py
          git diff --exit-code -- \
            constants/ev1DisplayContracts.ts \
            constants/ev1DisplayContractsChunks
          python scripts/validate_phase1_pageviewer.py --check-export
          python scripts/audit_phase1_visual_evidence_origin.py
