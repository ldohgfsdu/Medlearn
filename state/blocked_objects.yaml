schema_version: 1
objects:
  - id: phase1_document_tree_golden_path_validation
    title: Validate Document Tree golden-path reading experience in App
    status: paused
    objective: >
      Validate that locally accepted EV1 textbook knowledge can be consumed as a
      structured electronic textbook in the App—not merely queried from the
      database. Use asthma and pulmonary tuberculosis as golden-path sections
      only. Prove Document Tree → section → evidence/node → page-image return
      path before any full remote EV1 upload.
    scope:
      - docs/architecture/phase1_phase2_gate.md
      - docs/PHASE1_VISUAL_EVIDENCE_SOURCE_LOOP.md
      - CONTEXT.md
      - app/textbook/
      - services/textbookService.ts
      - constants/ev1DisplayContracts.ts
      - generated/knowledge_nodes/internal-medicine-10/第二篇_呼吸系统疾病__第四章_支气管哮喘.normalized.json
      - generated/knowledge_nodes/internal-medicine-10/第二篇_呼吸系统疾病__第八章_肺结核.normalized.json
      - generated/display_contracts/internal-medicine-10
      - scripts/export_phase1_evidence_lineage.py
      - scripts/export_phase1_page_assets.py
      - state/knowledge_ingestion.yaml
      - docs/CURRENT_STATE.md
    acceptance_criteria:
      - Document Tree terminology is mapped to Catalog Node / section model in CONTEXT.md and is used consistently in docs and acceptance checks.
      - Asthma section (第二篇 呼吸系统疾病 / 第四章 支气管哮喘) renders as structured textbook content in the App with stable hierarchy—not a flat knowledge card list.
      - Pulmonary tuberculosis section (第二篇 呼吸系统疾病 / 第八章 肺结核) renders as structured textbook content with stable hierarchy including classification-tree cases.
      - Each user-visible node in golden sections has traceable textbook evidence (page label and/or artifact linkage per ADR-009).
      - In both golden sections, sampled evidence can return to a page image or equivalent original textbook context (Phase 1 visual evidence rules; no LLM-invented bbox); validate the pulmonary-tuberculosis structure tree before extending its page-image bundle.
      - No concept graph, relation edges, or new disease-scope ingestion expansion is required to pass this object.
      - Full remote EV1 upload, production Supabase writes, and unrelated Case Simulator changes remain out of scope until this object completes.
    dependencies:
      - knowledge_ingestion_convergence
      - multi_textbook_pipeline_ir_stabilization
      - multi_parser_rawspan_adapter_integration
    adr_tags:
      - catalog_node
      - knowledge_detail
      - evidence_artifact
      - textbook_version
      - detail_page
    evidence:
      - docs/architecture/phase1_phase2_gate.md
      - docs/PHASE1_VISUAL_EVIDENCE_SOURCE_LOOP.md
      - generated/ev1_release_gate.json
      - generated/ev1_display_quality_report.json
      - state/knowledge_ingestion.yaml
    frozen: false
    activated_at: "2026-06-26"
    completed_at: null
    blocked_reason: >
      Paused (not completed) so multi_parser_rawspan_adapter_integration can land
      Docling and RapidOCR adapters plus unified RawSpan parity tests against the
      stabilized Document IR. Asthma and pulmonary tuberculosis bundles remain
      unchanged; App-side state intact. Resumes automatically when
      multi_parser_rawspan_adapter_integration closes.
    reactivated_at: null
    reactivation_reason: null

  - id: remote_supabase_validation
    title: Validate the deployed Supabase environment
    status: blocked
    objective: Verify migrations, functions, permissions, costs, and the complete case flow against a real project.
    scope:
      - supabase/migrations
      - supabase/functions
      - iOS and Android end-to-end flow
    acceptance_criteria:
      - Migrations 001 through 021 are applied.
      - Five Edge Functions are deployed with required secrets.
      - npm run verify:remote and npm run validate:cases pass.
      - An approved case completes end to end on iOS and Android.
      - Score reproducibility and cost events are verified.
    dependencies:
      - server_case_approval_enforcement
      - alpha_case_library
      - ai_proxy_cost_controls
    evidence:
      - scripts/deploy-remote-supabase.ps1
      - scripts/verify-remote-supabase.mjs
      - scripts/run-remote-e2e.mjs
      - docs/REMOTE_DEPLOYMENT_GUIDE.md
      - docs/E2E_ACCEPTANCE_CHECKLIST.md
      - npm run verify:remote
      - npm run validate:cases
      - npm run e2e:remote
    frozen: false
    activated_at: "2026-06-13"
    completed_at: null
    blocked_reason: >
      Case Simulator: remote API E2E passed (npm run e2e:remote); full iOS/Android
      device walkthrough still required per docs/E2E_ACCEPTANCE_CHECKLIST.md. Not the
      current Active Object—freeze case scope while phase1_document_tree_golden_path_validation
      is active.
    reactivated_at: null
    reactivation_reason: null

  - id: knowledge_remote_upload_validation
    title: Validate EV1 knowledge remote upload readiness
    status: blocked
    objective: >
      Prove the locally accepted EV1 knowledge bundle is safe to upload by running
      read-only local and remote preflight checks, documenting expected write
      impact, and preserving the no-upload boundary until explicit approval.
    scope:
      - scripts/ingest_knowledge.py
      - scripts/orchestrator.py
      - scripts/verify_pipeline_closure.py
      - generated/knowledge_nodes/internal-medicine-10
      - generated/display_contracts/internal-medicine-10
      - generated/source_qa_queue/internal-medicine-10
      - constants/ev1DisplayContracts.ts
      - state/knowledge_ingestion.yaml
    acceptance_criteria:
      - Local EV1 strict quality gates still pass for candidate quality, release gate, display quality, and app-visible source QA.
      - Remote-read preflight records current knowledge_nodes, document_chunks, and causal_chains integrity without writing remote data.
      - Expected upload write impact and rollback/stop conditions are explicit before any Supabase re-upload.
      - Staged or canary upload (asthma and tuberculosis golden sections first) succeeds on remote before any full-book upload.
      - No upload is run until phase1_document_tree_golden_path_validation completes and the user explicitly approves remote writes.
    dependencies:
      - knowledge_ingestion_convergence
      - phase1_document_tree_golden_path_validation
    adr_tags:
      - textbook_version
      - textbook_pipeline
      - evidence_artifact
      - knowledge_detail
      - database
    evidence:
      - docs/PIPELINE_INDEX.md
      - docs/REMOTE_DEPLOYMENT_GUIDE.md
      - generated/ev1_candidate_quality_report.json
      - generated/ev1_release_gate.json
      - generated/ev1_display_quality_report.json
      - generated/source_qa_queue/internal-medicine-10/_all.source_qa.json
      - state/knowledge_ingestion.yaml
    frozen: false
    activated_at: "2026-06-25"
    completed_at: null
    blocked_reason: >
      Read-only preflight passed; full remote upload is blocked until
      phase1_document_tree_golden_path_validation proves App reading experience
      (Document Tree, evidence, page-image return) on asthma and tuberculosis golden
      sections. Then use staged/canary upload—not immediate 1544→19961 full sync.
    reactivated_at: null
    reactivation_reason: null