objects:
  - id: remote_supabase_validation
    title: Validate the deployed Supabase environment
    status: blocked
    objective: Verify migrations, functions, permissions, costs, and the complete case flow against a real project.
    scope:
      - supabase/migrations
      - supabase/functions
      - iOS and Android end-to-end flow
    acceptance_criteria:
      - Migrations 001 through 021 are applied.
      - Five Edge Functions are deployed with required secrets.
      - npm run verify:remote and npm run validate:cases pass.
      - An approved case completes end to end on iOS and Android.
      - Score reproducibility and cost events are verified.
    dependencies:
      - server_case_approval_enforcement
      - alpha_case_library
      - ai_proxy_cost_controls
    evidence:
      - scripts/deploy-remote-supabase.ps1
      - scripts/verify-remote-supabase.mjs
      - scripts/run-remote-e2e.mjs
      - docs/REMOTE_DEPLOYMENT_GUIDE.md
      - docs/E2E_ACCEPTANCE_CHECKLIST.md
      - npm run verify:remote
      - npm run validate:cases
      - npm run e2e:remote
    frozen: false
    activated_at: "2026-06-13"
    completed_at: null
    blocked_reason: Remote API E2E passed (npm run e2e:remote); iOS/Android device walkthrough still required per docs/E2E_ACCEPTANCE_CHECKLIST.md.
    reactivated_at: null
    reactivation_reason: null

