  - id: server_case_approval_enforcement
    title: Enforce approved case status inside service-role functions
    status: completed
    objective: Prevent service-role Edge Functions from operating on draft, paused, or retired cases.
    scope:
      - supabase/functions/case-patient/index.ts
      - supabase/functions/case-submit/index.ts
      - supabase/functions/case-abandon/index.ts
      - supabase/functions/_shared/case-template-guard.ts
    acceptance_criteria:
      - Every service-role case lookup verifies is_active and review_status.
      - Draft and disabled cases are rejected even if a session references them.
      - Regression tests cover the bypass attempt.
    dependencies: []
    evidence:
      - tests/case-security.test.js service-role case functions reject unapproved templates
    frozen: true
    activated_at: "2026-06-13"
