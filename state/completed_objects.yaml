      - app/lib/knowledge.ts
      - supabase/migrations
      - scripts/textbook_pipeline
    acceptance_criteria:
      - One authoritative schema is documented.
      - Application queries and ingestion writes target that schema.
      - Numbered migrations create every required table and relation.
      - Existing data has an explicit migration or compatibility plan.
