schema_version: 1
objects:
  - id: multi_textbook_pipeline_ir_stabilization
    title: Multi-textbook pipeline IR stabilization
    status: completed
    objective: >
      Harden the canonical Document IR foundation before any PyMuPDF/Docling/RapidOCR
      adapter is connected. Lock structural validation, version external rule sources
      (subject hints, risk rules), and bind summary IDs to multi-version provenance.
      No data migration, no backfill, no production runner connection until all four
      P1 items pass.
    scope:
      - scripts/textbook_pipeline/document_ir.py
      - scripts/textbook_pipeline/subject_hints.py
      - scripts/textbook_pipeline/risk_rule_set.py
      - scripts/textbook_pipeline/summary_candidate.py
      - scripts/textbook_pipeline/evidence_release_gate.py
      - tests/test_document_ir.py
      - tests/test_subject_hints.py
      - tests/test_risk_rule_set.py
      - tests/test_summary_candidate.py
      - registry/subject_hints/registry.v1.yaml
      - registry/risk_rule_sets/registry.v1.yaml
    acceptance_criteria:
      - DocumentNode cycle detection and per-parent sibling_order uniqueness enforced by validate_document_ir() with negative tests.
      - SubjectProfile refactored to SubjectHints backed by a versioned YAML registry; Python module becomes a loader, not a hard-coded table.
      - Standalone versioned RiskRuleSet module, decoupled from SubjectHints, referenced only via stable ID + version.
      - Summary ID incorporates evidence, model, prompt, and rule version fields; tests cover version drift detection.
      - Document Tree carries no medical review status or subject semantics.
      - No data migration, backfill, or remote upload is triggered by this object.
    dependencies:
      - knowledge_ingestion_convergence
    adr_tags:
      - textbook_pipeline
      - textbook_version
      - evidence_artifact
    evidence:
      - "P1-1 validate_document_ir() enforces parent_id cycle detection (self + multi-node) and per-parent sibling_order uniqueness; 4 negative/positive tests pass."
      - "P1-2 subject_profile.py renamed to subject_hints.py; SubjectProfile -> SubjectHints; PROFILES/SIGNALS migrated to registry/subject_hints/registry.v1.yaml; high_risk_aspects removed in favor of default_risk_rule_set_id+version soft reference; 7 tests pass."
      - "P1-3 New risk_rule_set.py + registry/risk_rule_sets/registry.v1.yaml; RiskRuleSet decoupled from SubjectHints (zero imports, id+version string reference only); 7 tests pass."
      - "P1-4 EditorialSummaryCandidate adds evidence_version/model_version/prompt_version/rule_version fields, all included in candidate_id payload; 4 version-drift detection tests pass."
      - "Post-P1 cleanup by user: restored build_source_locators_v0() optional doc compat interface (PageViewer 48 regressions recovered); updated stale verifier tests to reflect stricter prefix/cross-artifact rules; fixed synthesis prompt string assertion; regenerated docs/CURRENT_STATE.md."
      - "P1 + verifier + synthesis + PageViewer: 98/98 tests pass."
      - "Pipeline closure: PASS. Project state: valid. CURRENT_STATE: current."
    frozen: true
    activated_at: "2026-07-03"
    completed_at: "2026-07-03"
    blocked_reason: null
    reactivated_at: null
    reactivation_reason: null

