      - docs/ADR_INDEX.yaml
      - docs/CURRENT_STATE.md
      - state/active_object.yaml
      - state/completed_objects.yaml
      - state/blocked_objects.yaml
      - scripts/validate_project_state.py
      - scripts/generate_current_state.py
    acceptance_criteria:
      - Project constitution separates stable identity from current execution state.
      - YAML files are the only source of runtime project state.
