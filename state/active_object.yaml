schema_version: 1
project:
  name: MedLearn
  phase: respiratory_mvp_validation
active_object:
  id: respiratory_mvp_real_question_validation
  title: Validate the respiratory MVP with one real wrong question
  objective: >
    Compare one real respiratory wrong-question lookup in the paper textbook
    and the accepted MVP to identify the single highest-friction product step.
  status: active
  activated_at: "2026-06-14"
  frozen: false
  scope:
    - memory/respiratory-knowledge-query-acceptance.md
    - one real respiratory wrong question
    - paper textbook lookup timing
    - MVP lookup timing
  acceptance_criteria:
    - One real wrong-question lookup is completed with the paper textbook.
    - The same lookup is completed through the MVP.
    - Both paths record elapsed time and navigation steps.
    - The MVP result reaches the correct aspect, textbook evidence, and page reference.
    - The highest-friction step is classified as search, catalog, detail, or evidence.
  dependencies:
    - respiratory_knowledge_query_mvp
  evidence:
    - memory/respiratory-knowledge-query-acceptance.md
    - user-recorded paper and MVP timings
  non_goals:
    - adding diseases
    - case training
    - Feynman training
    - line-level evidence
    - general-purpose RAG
