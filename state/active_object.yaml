    - textbook_version
    - detail_page
  evidence:
    - docs/PHASE1_VISUAL_EVIDENCE_SOURCE_LOOP.md
    - docs/PIPELINE_INDEX.md
    - docs/adr/ADR-009-multimodal-evidence-artifacts.md
