<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hermes办公室</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
      background:
        radial-gradient(circle at 18% 8%, rgba(255,255,255,.95), transparent 28%),
        linear-gradient(180deg, #fbfaf7 0%, #f4f1ec 100%);
      color: #172033;
      -webkit-font-smoothing: antialiased;
    }

    .office-shell { max-width: 1380px; margin: 0 auto; padding: 24px 34px 40px; }
    .glass { background: rgba(255,255,255,.78); border: 1px solid rgba(226,232,240,.8); box-shadow: 0 18px 42px rgba(15,23,42,.06); backdrop-filter: blur(14px); }
    .soft-shadow { box-shadow: 0 24px 40px rgba(15, 23, 42, .08), 0 4px 12px rgba(15,23,42,.04); }
    .micro { font-size: 10px; letter-spacing: .04em; text-transform: uppercase; }

    .desk {
      position: relative;
      min-height: 214px;
      padding: 20px 18px 16px;
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(255,255,255,.98), rgba(250,250,249,.88));
      border: 1px solid rgba(226,232,240,.78);
      box-shadow: 0 24px 36px rgba(15, 23, 42, .075), inset 0 1px 0 rgba(255,255,255,.9);
      transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
      overflow: hidden;
      cursor: pointer;
    }
    .desk:hover { transform: translateY(-4px); box-shadow: 0 30px 50px rgba(15, 23, 42, .11); border-color: var(--accent-soft); }
    .desk:before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 5px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      opacity: .82;
    }
    .screen {
      width: 108px;
      height: 66px;
      margin: 4px auto 0;
      border-radius: 18px;
      border: 1px solid rgba(15,23,42,.08);
      background: linear-gradient(145deg, var(--accent), var(--accent-2));
      box-shadow: inset 0 0 16px rgba(255,255,255,.26), 0 10px 18px rgba(15,23,42,.08);
      color: white;
      padding: 9px 10px;
      font-size: 10px;
      line-height: 1.25;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .screen-line { height: 5px; border-radius: 999px; background: rgba(255,255,255,.62); margin-top: 6px; }
    .screen-line.short { width: 58%; }
    .screen-line.mid { width: 76%; }

    .agent-body {
      width: 74px;
      height: 60px;
      margin: -6px auto 0;
      position: relative;
      filter: drop-shadow(7px 13px 5px rgba(15,23,42,.18));
    }
    .agent-body .horse {
      position: absolute;
      inset: 8px 0 0 0;
      background: #050505;
      border-radius: 52% 48% 48% 52% / 50% 52% 48% 50%;
    }
    .agent-body .horse:before,
    .agent-body .horse:after {
      content: "";
      position: absolute;
      top: -8px;
      width: 14px;
      height: 22px;
      background: #050505;
      border-radius: 999px;
    }
    .agent-body .horse:before { left: 16px; transform: rotate(-24deg); }
    .agent-body .horse:after { right: 16px; transform: rotate(24deg); }
    .agent-body .scarf {
      position: absolute;
      left: 50%;
      top: 28px;
      width: 42px;
      height: 20px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.28);
    }
    .agent-body .eye {
      position: absolute;
      left: 20px;
      top: 25px;
      width: 6px;
      height: 6px;
      background: white;
      border-radius: 999px;
      opacity: .92;
    }

    .status-dot { width: 8px; height: 8px; border-radius: 999px; display: inline-block; background: var(--status); box-shadow: 0 0 0 4px color-mix(in srgb, var(--status), transparent 78%); }
    .platform-pill { background: color-mix(in srgb, var(--accent), white 86%); color: color-mix(in srgb, var(--accent-2), black 18%); }
    .tag { border: 1px solid rgba(148,163,184,.24); background: rgba(248,250,252,.74); color: #64748b; }

    .empty-desk {
      min-height: 214px;
      border-radius: 28px;
      border: 1px dashed rgba(148,163,184,.35);
      background: rgba(255,255,255,.48);
      display: grid;
      place-items: center;
      color: #cbd5e1;
    }

    .timeline-item { position: relative; display: grid; grid-template-columns: 26px 1fr; gap: 12px; }
    .timeline-item:not(:last-child):before { content: ""; position: absolute; left: 12px; top: 26px; bottom: -17px; width: 2px; background: rgba(226,232,240,.96); }
    .timeline-dot { width: 24px; height: 24px; border-radius: 999px; display: grid; place-items: center; color: white; background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 8px 16px color-mix(in srgb, var(--accent), transparent 75%); }

    .modal-backdrop { background: rgba(15,23,42,.42); backdrop-filter: blur(6px); }
    #modalScrollBody::-webkit-scrollbar { width: 10px; }
    #modalScrollBody::-webkit-scrollbar-track { background: #f8fafc; }
    #modalScrollBody::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; border: 3px solid #f8fafc; }
    #modalScrollBody::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .tab-button.active { background: #0f172a; color: white; }

    .platform-feishu { --accent:#3370ff; --accent-2:#7c3aed; --accent-soft:#bfdbfe; --status:#22c55e; }
    .platform-wechat { --accent:#19c37d; --accent-2:#07a35a; --accent-soft:#bbf7d0; --status:#22c55e; }
    .platform-qq { --accent:#12a8ff; --accent-2:#facc15; --accent-soft:#fde68a; --status:#f59e0b; }

    @media (max-width: 1120px) {
      .layout { flex-direction: column; }
      .side { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="office-shell">
    <header class="mb-7 flex items-center justify-between gap-4">
      <div class="flex items-center gap-4">
        <div class="h-12 w-12 rounded-[22px] bg-black text-white grid place-items-center shadow-lg shadow-slate-300/40">
          <i class="fa-solid fa-horse-head text-2xl"></i>
        </div>
        <div>
          <h1 class="text-3xl font-semibold tracking-tight">Hermes办公室</h1>
          <p class="text-sm text-slate-500 mt-1">按接入的信息平台映射 Agent：飞书 / 微信 / QQ</p>
        </div>
      </div>
      <div class="glass rounded-[24px] px-4 py-3 flex items-center gap-4 text-sm">
        <span class="status-dot" style="--status:#22c55e"></span>
        <div>
          <div id="apiStatusTitle" class="font-medium">API Server 在线</div>
          <div id="apiStatusSub" class="text-xs text-slate-500">0.0.0.0:8642 · Gateway run</div>
        </div>
      </div>
    </header>

    <div class="layout flex gap-8 items-start">
      <section class="flex-1 min-w-0">
        <div class="grid grid-cols-[1fr_300px] gap-6 mb-7 max-lg:grid-cols-1">
          <div class="glass rounded-[32px] p-6 h-[150px] relative overflow-hidden">
            <div class="absolute top-5 left-6 text-xs font-medium text-slate-400">休息区 / 消息缓冲区</div>
            <div class="absolute bottom-0 left-8 right-8 h-[82px] bg-white/80 rounded-t-[26px] shadow-inner border border-white flex items-end px-7 pb-4">
              <div class="flex gap-3 items-end">
                <span class="w-5 h-7 rounded-b-xl bg-[#d4a373] border border-[#b38b5e]"></span>
                <span class="w-5 h-7 rounded-b-xl bg-[#c9a66b] border border-[#a17d4e]"></span>
                <span class="w-5 h-7 rounded-b-xl bg-[#d4a373] border border-[#b38b5e]"></span>
                <span class="w-5 h-7 rounded-b-xl bg-[#c9a66b] border border-[#a17d4e]"></span>
              </div>
              <div class="ml-auto flex items-center gap-3 text-xs text-slate-400">
                <div class="w-12 h-12 bg-white rounded-2xl border border-slate-200 grid place-items-center shadow-sm">
                  <i class="fa-solid fa-mug-hot text-amber-700 text-xl"></i>
                </div>
                <span>等待新平台接入</span>
              </div>
            </div>
          </div>
          <div class="glass rounded-[32px] p-5 h-[150px]">
            <div class="text-sm text-slate-500">办公室概览</div>
            <div class="grid grid-cols-3 gap-2 mt-4">
              <div class="bg-white/70 rounded-2xl p-3 text-center"><div id="statPlatformCount" class="text-2xl font-semibold">3</div><div class="text-xs text-slate-400">平台</div></div>
              <div class="bg-emerald-50 rounded-2xl p-3 text-center"><div id="statOnlineCount" class="text-2xl font-semibold text-emerald-600">2</div><div class="text-xs text-emerald-600">在线</div></div>
              <div class="bg-amber-50 rounded-2xl p-3 text-center"><div id="statWarningCount" class="text-2xl font-semibold text-amber-600">1</div><div class="text-xs text-amber-600">波动</div></div>
            </div>
          </div>
        </div>

        <div id="officeGrid" class="grid grid-cols-3 gap-6 max-lg:grid-cols-2 max-sm:grid-cols-1"></div>

        <div class="mt-5 flex justify-end text-xs text-slate-400 items-center gap-2">
          <i class="fa-solid fa-route"></i>
          <span>路由规则：消息平台 → 专属 Agent → 进化档案 / 技能 / 记忆</span>
        </div>
      </section>

      <aside class="side w-[360px] shrink-0 space-y-5">
        <div class="glass rounded-[32px] p-5">
          <div class="flex justify-between items-start">
            <div>
              <div class="text-sm text-slate-500">今日 Token 消耗</div>
              <div class="text-3xl font-semibold tabular-nums mt-1">49,772</div>
              <div class="text-xs text-slate-400">/ 10,000,000</div>
            </div>
            <div class="text-xs bg-amber-100 text-amber-700 px-2.5 py-1 rounded-full">47.7%</div>
          </div>
          <div class="h-1.5 bg-slate-100 rounded-full overflow-hidden mt-5"><div class="h-full bg-gradient-to-r from-amber-400 to-orange-500 rounded-full" style="width:47.7%"></div></div>
          <div class="mt-4 text-xs flex justify-between"><span class="text-slate-400">今日节省 Token</span><span class="text-emerald-600 font-medium">0 · 本地模型</span></div>
        </div>

        <div class="glass rounded-[32px] p-5">
          <div class="flex justify-between items-center mb-4">
            <div class="text-sm text-slate-500">接入平台状态</div>
            <button onclick="refreshOfficeData()" class="text-xs px-3 py-1 rounded-full bg-white hover:bg-slate-50 border border-slate-200">刷新</button>
          </div>
          <div id="platformStatusList" class="space-y-3"></div>
        </div>

        <div class="glass rounded-[32px] p-5">
          <div class="flex justify-between items-center mb-4">
            <div class="text-sm text-slate-500">最近跨平台活动</div>
            <button onclick="refreshRecentActivity()" class="text-xs px-3 py-1 rounded-full bg-white hover:bg-slate-50 border border-slate-200">刷新</button>
          </div>
          <div id="recentActivityList" class="space-y-4 text-sm"></div>
        </div>
      </aside>
    </div>
  </main>

  <div id="agentModal" class="hidden fixed inset-0 z-50 modal-backdrop items-center justify-center p-6" onclick="closeModal()">
    <div class="w-full max-w-[880px] max-h-[88vh] rounded-[34px] bg-white shadow-2xl overflow-hidden flex flex-col" onclick="event.stopPropagation()">
      <div id="modalHead" class="px-7 pt-6 pb-5 text-white relative flex-shrink-0 overflow-hidden">
        <div class="absolute inset-0 opacity-95" id="modalGradient"></div>
        <div class="relative flex justify-between items-start gap-4">
          <div class="flex gap-4 items-center min-w-0">
            <div id="modalIcon" class="h-14 w-14 bg-white/18 rounded-3xl grid place-items-center text-2xl border border-white/20 shrink-0"></div>
            <div class="min-w-0">
              <div class="text-2xl font-semibold truncate" id="modalName"></div>
              <div class="text-sm opacity-80 mt-1 truncate" id="modalSubtitle"></div>
            </div>
          </div>
          <button class="h-10 w-10 rounded-full bg-white/16 hover:bg-white/24 shrink-0 grid place-items-center" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
        </div>
      </div>

      <div class="flex-1 min-h-0 overflow-y-auto px-7 py-6 space-y-7" id="modalScrollBody">
        <section>
          <div class="text-sm font-semibold text-slate-800 mb-3 flex items-center gap-2">
            <i class="fa-solid fa-plug text-slate-400"></i><span>接入信息</span>
          </div>
          <div id="modalInfo" class="grid grid-cols-2 gap-3 text-sm max-sm:grid-cols-1"></div>
        </section>

        <section>
          <div class="text-sm font-semibold text-slate-800 mb-3 flex items-center gap-2">
            <i class="fa-solid fa-list-check text-slate-400"></i><span>平台能力</span>
          </div>
          <div id="modalCaps" class="flex flex-wrap gap-2"></div>
        </section>

        <section>
          <div class="flex items-center justify-between mb-4">
            <div class="text-sm font-semibold text-slate-800 flex items-center gap-2">
              <i class="fa-solid fa-clock-rotate-left text-slate-400"></i><span>进化档案</span>
            </div>
            <div class="text-xs text-slate-400">按平台独立记录 · 支持滚动</div>
          </div>
          <div id="modalTimeline" class="space-y-5 pr-2"></div>
        </section>
      </div>

      <div class="px-7 py-5 bg-slate-50 border-t border-slate-100 flex justify-between items-center gap-3 flex-shrink-0">
        <div class="text-xs text-slate-400">Esc 关闭 · 内容过长时中间区域滚动</div>
        <div class="flex gap-3">
          <button onclick="closeModal()" class="px-5 py-2.5 text-sm text-slate-600 hover:text-slate-900 rounded-2xl hover:bg-white">关闭</button>
          <button onclick="showSendCommandModal()" class="px-6 py-2.5 text-sm bg-black text-white rounded-2xl hover:bg-slate-800 flex items-center gap-2"><i class="fa-solid fa-paper-plane"></i><span>发送指令</span></button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const fallbackAgents = [
      {
        id: 'feishu', name: '飞书 Agent', platform: 'Feishu / Lark', role: '企业协作入口', connector: 'WebSocket + Bot 授权',
        icon: 'fa-solid fa-paper-plane', className: 'platform-feishu', statusText: '演示在线', stateKind: 'connected', signal: 'fallback demo', handle: 'Feishu Bot',
        capabilities: ['群聊/私聊', '飞书文档', '审批提醒', '任务分发'], screenLines: ['FEISHU WS', 'docs + chat'],
        milestones: [['2026-06-13', '平台纳入办公室', '飞书 Agent 已按平台样式生成；等待本地服务返回真实状态。']]
      },
      {
        id: 'wechat', name: '微信 Agent', platform: 'Weixin / WeChat', role: '个人消息与归档入口', connector: 'Weixin Home Channel',
        icon: 'fa-brands fa-weixin', className: 'platform-wechat', statusText: '演示在线', stateKind: 'connected', signal: 'fallback demo', handle: 'Weixin Home Channel',
        capabilities: ['私聊通知', '消息归档', '语音转写', '长期记忆'], screenLines: ['WECHAT HOME', 'archive=on'],
        milestones: [['2026-06-13', '平台纳入办公室', '微信 Agent 已按平台样式生成；等待本地服务返回真实状态。']]
      },
      {
        id: 'qq', name: 'QQ Agent', platform: 'QQ Bot', role: 'QQ 私聊 / 群聊入口', connector: 'QQBot WebSocket',
        icon: 'fa-brands fa-qq', className: 'platform-qq', statusText: '演示在线', stateKind: 'connected', signal: 'fallback demo', handle: 'QQBot',
        capabilities: ['C2C 消息', '群聊监听', '自动重连', '附件识别'], screenLines: ['QQBOT C2C', 'reconnect'],
        milestones: [['2026-06-13', '平台纳入办公室', 'QQ Agent 已按平台样式生成；等待本地服务返回真实状态。']]
      }
    ];
    let agents = [...fallbackAgents];
    let currentAgentId = null;

    function stateColor(agent) {
      const kind = agent && agent.stateKind;
      if (kind === 'connected') return '#22c55e';
      if (kind === 'connecting') return '#f59e0b';
      if (kind === 'error') return '#ef4444';
      if (kind === 'offline') return '#94a3b8';
      return agent && agent.statusText === '在线' ? '#22c55e' : '#f59e0b';
    }

    function renderOffice() {
      const grid = document.getElementById('officeGrid');
      grid.innerHTML = agents.map(agent => `
        <article class="desk ${agent.className}" onclick="openAgent('${agent.id}')">
          <div class="absolute top-4 right-4 platform-pill rounded-full px-3 py-1 text-xs font-medium flex items-center gap-1.5">
            <i class="${agent.icon}"></i><span>${agent.platform.split(' ')[0]}</span>
          </div>
          <div class="screen">
            <div class="font-semibold tracking-wide">${agent.screenLines[0]}</div>
            <div class="screen-line mid"></div>
            <div class="screen-line short"></div>
            <div class="mt-1 opacity-80">${agent.screenLines[1]}</div>
          </div>
          <div class="agent-body"><div class="horse"></div><div class="scarf"></div><div class="eye"></div></div>
          <div class="text-center mt-3">
            <div class="font-semibold text-slate-800">${agent.name}</div>
            <div class="text-xs text-slate-500 mt-1">${agent.role}</div>
            <div class="mt-3 flex items-center justify-center gap-2 text-xs">
              <span class="status-dot" style="--status:${stateColor(agent)}"></span><span class="font-medium">${agent.statusText}</span>
            </div>
          </div>
          <div class="mt-4 flex flex-wrap justify-center gap-1.5">
            ${agent.capabilities.slice(0,3).map(c => `<span class="tag rounded-full px-2.5 py-1 text-[11px]">${c}</span>`).join('')}
          </div>
        </article>
      `).join('') + `
        <div class="empty-desk"><div class="text-center"><i class="fa-solid fa-plus text-2xl mb-3"></i><div class="text-xs">预留平台</div><div class="text-[10px] mt-1">Telegram / Discord</div></div></div>
        <div class="empty-desk"><div class="text-center"><i class="fa-solid fa-plug text-2xl mb-3"></i><div class="text-xs">Webhook Agent</div><div class="text-[10px] mt-1">等待接入</div></div></div>
        <div class="empty-desk"><div class="text-center"><i class="fa-solid fa-door-open text-2xl mb-3"></i><div class="text-xs">会议室</div><div class="text-[10px] mt-1">多 Agent 协作</div></div></div>
      `;

      const list = document.getElementById('platformStatusList');
      list.innerHTML = agents.map(a => `
        <button class="w-full text-left rounded-2xl bg-white/70 hover:bg-white border border-slate-100 px-4 py-3 ${a.className}" onclick="openAgent('${a.id}')">
          <div class="flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 min-w-0">
              <div class="h-9 w-9 rounded-2xl grid place-items-center text-white" style="background:linear-gradient(135deg,var(--accent),var(--accent-2))"><i class="${a.icon}"></i></div>
              <div class="min-w-0"><div class="font-medium text-sm truncate">${a.name}</div><div class="text-xs text-slate-400 truncate">${a.signal}</div></div>
            </div>
            <span class="status-dot shrink-0" style="--status:${stateColor(a)}"></span>
          </div>
        </button>
      `).join('');
    }

    function renderRecentActivity(activities) {
      const container = document.getElementById('recentActivityList');
      if (!activities || activities.length === 0) {
        container.innerHTML = '<div class="text-xs text-slate-400">暂无最近活动</div>';
        return;
      }
      container.innerHTML = activities.map(act => `
        <div class="flex gap-3">
          <div class="w-7 h-7 rounded-full ${act.color} grid place-items-center shrink-0">
            <i class="${act.icon} text-xs"></i>
          </div>
          <div>
            <div class="text-slate-700">${act.title}</div>
            <div class="text-xs text-slate-400 mt-0.5">${act.time}</div>
          </div>
        </div>
      `).join('');
    }

    function apiOfficeUrl() {
      // 通过本地服务打开时用相对路径；双击 file:// 打开时也能连到本地桥服务。
      return location.protocol === 'file:' ? 'http://127.0.0.1:8787/api/office' : '/api/office';
    }

    function setBridgeConnecting() {
      const apiTitle = document.getElementById('apiStatusTitle');
      const apiSub = document.getElementById('apiStatusSub');
      if (apiTitle) apiTitle.textContent = '正在连接本地桥服务';
      if (apiSub) apiSub.textContent = '尝试读取 http://127.0.0.1:8787/api/office';
    }

    async function loadRealOfficeData() {
      try {
        const res = await fetch(apiOfficeUrl(), { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        if (data && data.ok && Array.isArray(data.agents)) {
          agents = data.agents.length ? data.agents : [...fallbackAgents];
          updateOfficeMeta(data);
          renderOffice();
          if (data.recentActivities) {
            renderRecentActivity(data.recentActivities);
          }
        }
      } catch (err) {
        console.warn('[Hermes办公室] 使用静态演示数据：', err);
        agents = [...fallbackAgents];
        updateOfficeMeta(null);
        renderOffice();
      }
    }

    function updateOfficeMeta(data) {
      const apiTitle = document.getElementById('apiStatusTitle');
      const apiSub = document.getElementById('apiStatusSub');
      const platformCount = document.getElementById('statPlatformCount');
      const onlineCount = document.getElementById('statOnlineCount');
      const warningCount = document.getElementById('statWarningCount');
      if (!data || !data.stats) {
        apiTitle.textContent = '演示模式';
        apiSub.textContent = '直接打开 HTML · 未连接本地桥接服务';
        platformCount.textContent = agents.length;
        onlineCount.textContent = agents.filter(a => a.statusText === '在线').length;
        warningCount.textContent = agents.filter(a => a.statusText !== '在线').length;
        return;
      }
      apiTitle.textContent = data.stats.gateway_state === 'running' ? 'Hermes Gateway 在线' : 'Hermes Gateway 状态未知';
      apiSub.textContent = `${data.hermes_api || 'http://127.0.0.1:8642'} · PID ${data.stats.gateway_pid || '-'} · ${new Date(data.generated_at).toLocaleTimeString()}`;
      platformCount.textContent = data.stats.platform_count;
      onlineCount.textContent = data.stats.online_count;
      warningCount.textContent = data.stats.warning_count;
    }

    function refreshOfficeData() {
      loadRealOfficeData();
    }

    function refreshRecentActivity() {
      loadRealOfficeData();
    }

    function openAgent(id) {
      const agent = agents.find(a => a.id === id);
      if (!agent) return;
      currentAgentId = id;
      const modal = document.getElementById('agentModal');
      document.getElementById('modalHead').className = `px-7 pt-6 pb-5 text-white relative flex-shrink-0 overflow-hidden ${agent.className}`;
      document.getElementById('modalGradient').style.background = 'linear-gradient(135deg, var(--accent), var(--accent-2))';
      document.getElementById('modalIcon').innerHTML = `<i class="${agent.icon}"></i>`;
      document.getElementById('modalName').textContent = agent.name;
      document.getElementById('modalSubtitle').textContent = `${agent.platform} · ${agent.role}`;
      document.getElementById('modalInfo').innerHTML = [
        ['接入方式', agent.connector], ['账号 / 句柄', agent.handle], ['连接信号', agent.signal], ['当前状态', agent.statusText]
      ].map(([k,v]) => `<div class="rounded-2xl bg-slate-50 border border-slate-100 p-3"><div class="text-xs text-slate-400">${k}</div><div class="mt-1 font-medium text-slate-700 break-all">${v}</div></div>`).join('');
      document.getElementById('modalCaps').innerHTML = agent.capabilities.map(c => `<span class="rounded-full px-3 py-1.5 text-xs bg-slate-100 text-slate-600">${c}</span>`).join('');
      document.getElementById('modalTimeline').innerHTML = agent.milestones.map(m => `
        <div class="timeline-item ${agent.className}">
          <div class="timeline-dot"><i class="fa-solid fa-check text-[10px]"></i></div>
          <div>
            <div class="font-medium text-slate-800">${m[1]}</div>
            <div class="text-xs text-slate-400 mt-0.5">${m[0]}</div>
            <div class="text-sm text-slate-600 mt-1 leading-relaxed">${m[2]}</div>
          </div>
        </div>
      `).join('');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeModal(){ 
      const m=document.getElementById('agentModal'); 
      m.classList.add('hidden'); 
      m.classList.remove('flex'); 
    }

    function showSendCommandModal() {
      const agent = agents.find(a => a.id === currentAgentId);
      if (!agent) return;
      const command = prompt(`给 ${agent.name} 记录一条本地指令：`);
      if (!command || !command.trim()) return;
      const today = new Date().toISOString().slice(0, 10);
      agent.milestones = agent.milestones || [];
      agent.milestones.unshift([today, '本地指令记录', command.trim()]);
      openAgent(agent.id);
      toast(`已记录到 ${agent.name} 的进化档案（本地）`);
    }

    function toast(message){
      const t=document.createElement('div');
      t.className='fixed bottom-8 left-1/2 -translate-x-1/2 bg-slate-950 text-white rounded-full px-5 py-3 text-sm shadow-2xl z-[60]';
      t.textContent=message; 
      document.body.appendChild(t);
      setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .25s';setTimeout(()=>t.remove(),260)},1500);
    }

    function refreshToast(){
      toast('已按真实平台连接状态刷新');
    }

    document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });
    renderOffice();
    setBridgeConnecting();
    loadRealOfficeData();
    setInterval(loadRealOfficeData, 15000);
  </script>
</body>
</html>
